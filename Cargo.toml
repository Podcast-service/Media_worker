[package]
name = "media_worker"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenTelemetry: export traces, metrics and logs to the OTEL collector (OTLP/gRPC).
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.27"
tracing-opentelemetry = "0.28"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1.0"
async-trait = "0.1"
aws-credential-types = "1.2.13"
aws-sdk-s3 = "1.124.0"
aws-config = "1.8.14"
utoipa = { version = "4", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }
dashmap = "6"
async-stream = "0.3"
futures-core = "0.3"
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
tokio-stream = "0.1"
chrono = { version = "0.4", features = ["serde"] }
